[devobox]
image=archlinux:latest
root=false
pull=true
replace=true

# --- ISOLATION ---
home=~/devobox

# --- VOLUMES ---
volume=~/code:~/devobox/code
volume=~/.ssh:~/devobox/.ssh

# --- PACKAGES ---
additional_packages="neovim zellij lazygit git ripgrep mise starship base-devel openssh unzip curl wget pkgconf openssl zlib readline libyaml ncurses libffi gdbm postgresql-libs redis imagemagick libvips fd vim zip tar xclip python python-pip cmake iputils iproute2 bind ca-certificates fzf tree-sitter-cli"

# --- HOOKS ---
init_hooks="mkdir -p ~/.config"
init_hooks="[ ! -d ~/.config/nvim ] && git clone --depth 1 https://github.com/JohnAnon9771/my-nvim.git ~/.config/nvim || echo 'Nvim config ja existe'"

# zellij
init_hooks="mkdir -p ~/.config/zellij"
init_hooks="[ ! -f ~/.config/zellij/config.kdl ] && curl -fLo ~/.config/zellij/config.kdl https://raw.githubusercontent.com/JohnAnon9771/devobox/main/.config/zellij/config.kdl || echo 'Zellij ok'"

# Starship
init_hooks="[ ! -f ~/.config/starship.toml ] && curl -fLo ~/.config/starship.toml https://raw.githubusercontent.com/JohnAnon9771/devobox/main/.config/starship.toml || echo 'Starship ok'"

# Profile
init_hooks="[ ! -f ~/.profile ] && curl -fLo ~/.profile https://raw.githubusercontent.com/JohnAnon9771/devobox/main/.config/profile || echo 'Profile ok'"
