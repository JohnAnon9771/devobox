<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boxGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" /> <!-- Blue-500 -->
      <stop offset="100%" stop-color="#8B5CF6" /> <!-- Violet-500 -->
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Main Box Shape (Hexagon) -->
  <path d="M100 25 L169.28 65 V145 L100 185 L30.72 145 V65 Z" 
        fill="url(#boxGradient)" 
        filter="url(#shadow)"
        rx="10" />

  <!-- Top highlight for 3D effect (subtle) -->
  <path d="M100 25 L169.28 65 L100 105 L30.72 65 Z" 
        fill="white" 
        fill-opacity="0.1" />

  <!-- Terminal Prompt Symbol (>_) -->
  <g transform="translate(0, 5)">
    <!-- The arrow (>) -->
    <path d="M75 85 L100 110 L75 135" 
          fill="none" 
          stroke="white" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- The cursor (_) -->
    <line x1="110" y1="135" x2="140" y2="135" 
          stroke="white" 
          stroke-width="12" 
          stroke-linecap="round" />
  </g>
</svg>
